<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYTH WAR MECHA // GLOBAL EXCAVATION ARCHIVE</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg-color: #05070c;
      --card-bg: #0c111a;
      --card-inner: #080c14;
      --accent-cyan: #00f0ff;
      --accent-gold: #e5b95f;
      --text-main: #e2e8f0;
      --text-dim: #798b9f;
      --border-color: #1a2332;
      --border-bright: #00f0ff44;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .space-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, #0d1527 0%, #030508 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* 1. ヘッダー */
    header {
      position: relative;
      z-index: 10;
      padding: 1.5rem 1rem 0.8rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      background: linear-gradient(180deg, rgba(5,7,12,0.95) 0%, rgba(5,7,12,0.8) 100%);
      backdrop-filter: blur(10px);
    }

    .hud-badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--accent-cyan);
      border: 1px solid var(--border-bright);
      padding: 0.2rem 0.6rem;
      border-radius: 2px;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      background: rgba(0, 240, 255, 0.05);
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 0.2rem;
      letter-spacing: 0.08em;
    }

    /* 2. 地球儀ナビセクション */
    #globe-section {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 48vh;
      min-height: 340px;
      max-height: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #globe-canvas {
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
      touch-action: none;
    }

    #globe-canvas:active {
      cursor: grabbing;
    }

    /* ナビゲーションバー（セクター切替ボタン群） */
    .sector-nav-bar {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: -1.2rem auto 1.5rem;
      padding: 0 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .nav-btn {
      background: rgba(12, 17, 26, 0.9);
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 0.45rem 0.9rem;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(5px);
    }

    .nav-btn:hover {
      border-color: var(--accent-cyan);
      color: #fff;
    }

    .nav-btn.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      font-weight: bold;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
    }

    .nav-btn.overview-btn {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .nav-btn.overview-btn.active {
      background: rgba(229, 185, 95, 0.15);
      box-shadow: 0 0 12px rgba(229, 185, 95, 0.25);
    }

    /* 3. 表示部分（動的エリア） */
    main {
      position: relative;
      z-index: 2;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.2rem 4rem;
    }

    .display-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 1.75rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* プロジェクト概要表示 */
    .overview-view .panel-tag {
      font-size: 0.75rem;
      color: var(--accent-gold);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .overview-view h2 {
      font-size: 1.4rem;
      color: #fff;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }

    .overview-view p {
      font-size: 0.92rem;
      color: var(--text-main);
      line-height: 1.9;
      margin-bottom: 1rem;
    }

    .overview-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
    }

    .overview-meta-item {
      background: var(--card-inner);
      padding: 1rem;
      border-left: 2px solid var(--accent-cyan);
    }

    .overview-meta-item .label {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-bottom: 0.25rem;
    }

    .overview-meta-item .val {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
    }

    /* セクター詳細表示 */
    .sector-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    .sector-title-group .tag {
      font-size: 0.72rem;
      color: var(--accent-cyan);
      letter-spacing: 0.15em;
    }

    .sector-title-group h2 {
      font-size: 1.4rem;
      color: #fff;
      margin-top: 0.2rem;
    }

    .back-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .back-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* 機体アコーディオンリスト */
    .mecha-accordion-item {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      margin-bottom: 1rem;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .mecha-accordion-item:hover {
      border-color: rgba(0, 240, 255, 0.4);
    }

    .accordion-header {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      background: rgba(255, 255, 255, 0.01);
    }

    .accordion-header .m-name {
      font-size: 1.05rem;
      font-weight: bold;
      color: #fff;
    }

    .accordion-header .toggle-icon {
      color: var(--accent-cyan);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      transition: transform 0.2s ease;
    }

    .mecha-accordion-item.open .accordion-header .toggle-icon {
      transform: rotate(180deg);
    }

    .accordion-body {
      display: none;
      padding: 1.25rem;
      border-top: 1px solid var(--border-color);
      background: #040609;
    }

    .mecha-accordion-item.open .accordion-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 768px) {
      .mecha-accordion-item.open .accordion-body {
        grid-template-columns: 1fr 1fr;
      }
    }

    .image-frame {
      width: 100%;
      min-height: 240px;
      background: #020305;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .image-frame img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .image-frame .placeholder {
      color: var(--text-dim);
      font-size: 0.8rem;
      text-align: center;
      padding: 1.5rem;
    }

    .spec-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .spec-table th, .spec-table td {
      padding: 0.45rem 0.5rem;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    .spec-table th {
      color: var(--text-dim);
      width: 32%;
      white-space: nowrap;
    }

    .doctrine-box {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(0, 240, 255, 0.03);
      border-left: 2px solid var(--accent-cyan);
      font-size: 0.82rem;
      color: var(--text-main);
    }

    .story-card {
      margin-top: 1.5rem;
      padding: 1.2rem;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-gold);
    }

    .story-card .tag {
      font-size: 0.7rem;
      color: var(--accent-gold);
      letter-spacing: 0.15em;
      margin-bottom: 0.3rem;
    }

    .story-card .title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .story-card .text {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.75;
      font-style: italic;
    }

    /* モーダル */
    #image-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 8, 0.95);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      flex-direction: column;
    }

    #image-modal.active {
      display: flex;
    }

    #modal-img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border: 1px solid var(--border-bright);
    }

    #modal-caption {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--accent-cyan);
      letter-spacing: 0.1em;
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      font-size: 2rem;
      color: var(--text-dim);
      cursor: pointer;
    }

    /* 4. フッター */
    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2.5rem 1rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

            doctrineText: "装甲を持たない腹部からプラーナを循環・放出し、風袋による三次元噴射と高圧衝撃波で戦場全域の気流を支配する。"
          }
        ],
        story: {
          tag: "EXCAVATION LOG #06-F",
          title: "呼吸する白亜の霊風",
          text: "装甲を持たない腹部から絶え間なくエネルギーを排吸し続ける白磁の機体。背部の球体風袋から解き放たれた気流の渦は、戦場全体の空気を奪い去り、触れた敵機を分子レベルで風化させた。"
        }
      },
      {
        id: "sector-mesoamerica",
        mythBadge: "MESOAMERICA",
        btnLabel: "メソアメリカ",
        sectorTag: "SECTOR 07 // MESOAMERICA",
        sectorName: "メソアメリカ神話",
        lat: 19.4,
        lon: -99.1,
        mechaList: [
          {
            name: "ケツァルコアルト [QUETZALCOATL]",
            image: "quetzalcoatl.png",
            specs: [
              { label: "全高 (頭頂部)", value: "14.0m / 重量: 不明" },
              { label: "機体方式", value: "精神波同期式コアドライブ" },
              { label: "群体ユニット", value: "ユーマ（羽の子 / スカイフィッシュ型小型群体）" },
              { label: "主能力", value: "風圧カッター / 気流竜巻 / 再生フィールド" }
            ],
            doctrineTitle: "運用ドクトリン: 循環・群体攪乱・再生",
            doctrineText: "破壊よりも秩序の再構築を重視。自らの羽根から数十機の小型群体「ユーマ」を生成・放出し、風の循環で包み込んで敵を削り制圧する。"
          }
        ],
        story: {
          tag: "EXCAVATION LOG #07-G",
          title: "密林の羽毛蛇と群れ飛ぶ子ら",
          text: "熱帯雨林の奥底、緑青に覆われた蛇型巨神。その翼から無数に剥離した小型飛翔体『ユーマ』の群れは、風を喰らい自己修復を繰り返しながら、侵入者を跡形もなく解体していった。"
        }
      },
      {
        id: "sector-japan",
        mythBadge: "SHINTO MYTH",
        btnLabel: "日本 (出雲)",
        sectorTag: "SECTOR 08 // FAR EAST ARCHIPELAGO",
        sectorName: "日ノ本神代連合",
        lat: 35.0,
        lon: 135.7,
        mechaList: [
          {
            name: "スサノオ [SUSANOO]",
            image: "susanoo.png",
            specs: [
              { label: "全高 / 重量", value: "14.5m / 31.0t" },
              { label: "動力", value: "八咫鏡型・熱核共鳴炉" },
              { label: "主兵装", value: "十拳剣 / 天叢雲剣" },
              { label: "運用思想", value: "荒魂（アラミタマ）暴走覚醒による単騎決戦" }
            ],
            doctrineTitle: "運用ドクトリン: 荒魂抜刀・神罰顕現",
            doctrineText: "高出力熱核照射による広域薙ぎ払いと、十拳剣による近接抜刀一撃必殺。機体出力の臨界突破を前提とする。"
          }
        ],
        story: {
          tag: "EXCAVATION LOG #08-H",
          title: "出雲深層の荒ぶる鉄魂",
          text: "出雲大社最深部の岩戸より検知された異常な熱核反応。調査隊が見たものは、幾重もの注連縄で封じられた巨大な刀身と、黒鉄の鎧に身を包んだ巨神の沈黙の姿であった。"
        }
      }
    ];

    const mainPanel = document.getElementById('main-content-panel');
    const navContainer = document.getElementById('nav-buttons-container');

    // ナビボタン生成
    SECTORS_DATA.forEach(sec => {
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.id = `nav-${sec.id}`;
      btn.textContent = sec.btnLabel;
      btn.onclick = () => selectSector(sec.id);
      navContainer.appendChild(btn);
    });

    // 初期表示：全体概要
    function showOverview() {
      updateActiveNav('overview');
      autoRotate = true;
      targetRotation = null;

      mainPanel.innerHTML = `
        <div class="overview-view">
          <div class="panel-tag">// GLOBAL BRIEFING // プロジェクト概要</div>
          <h2>超古代神話兵器 発掘解析データベース</h2>
          <p>
            西暦20XX年、世界各地の超古代地層・海溝・霊峰地下より、現代物理学の定義を覆す巨大人型機動兵器「神代機体」が相次いで発掘された。
          </p>
          <p>
            解析の結果、世界各国に口伝・記術されてきた「神話」とは、かつてこの星で繰り広げられた文明間最終戦争の記録であることが判明。
            上の地球儀、またはナビゲーションボタンから各発掘地域（セクター）を選択することで、所属機体の詳細スペックおよび発掘記録ログを閲覧できます。
          </p>
          <div class="overview-meta-grid">
            <div class="overview-meta-item">
              <div class="label">CONFIRMED SECTORS</div>
              <div class="val">${SECTORS_DATA.length} 勢力 / 地域</div>
            </div>
            <div class="overview-meta-item">
              <div class="label">ESTIMATED AGE</div>
              <div class="val">約 10,000 年前</div>
            </div>
            <div class="overview-meta-item">
              <div class="label">SYSTEM STATUS</div>
              <div class="val" style="color:var(--accent-cyan)">STANDBY / ONLINE</div>
            </div>
          </div>
        </div>
      `;
    }

    // セクター選択表示
    function selectSector(sectorId) {
      const sec = SECTORS_DATA.find(s => s.id === sectorId);
      if (!sec) return;

      updateActiveNav(sectorId);
      rotateGlobeTo(sec.lat, sec.lon);

      const mechaItemsHTML = sec.mechaList.map((m, idx) => {
        const specRows = m.specs.map(s => `<tr><th>${s.label}</th><td>${s.value}</td></tr>`).join('');
        // デフォルトで1体目は開いた状態にする
        const openClass = idx === 0 ? 'open' : '';
        return `
          <div class="mecha-accordion-item ${openClass}" id="m-item-${idx}">
            <div class="accordion-header" onclick="toggleAccordion('m-item-${idx}')">
              <span class="m-name">▶ ${m.name}</span>
              <span class="toggle-icon">▼</span>
            </div>
            <div class="accordion-body">
              <div class="image-frame" onclick="openModal('${m.image}', '${m.name}')">
                <img src="${m.image}" alt="${m.name}" onerror="this.outerHTML='<div class=\\'placeholder\\'>[ ${m.name} // 画像未設定 ]</div>'">
              </div>
              <div class="mecha-info-block">
                <table class="spec-table">
                  ${specRows}
                </table>
                <div class="doctrine-box">
                  <strong>${m.doctrineTitle}</strong><br>
                  ${m.doctrineText}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      mainPanel.innerHTML = `
        <div class="sector-view">
          <div class="sector-header-flex">
            <div class="sector-title-group">
              <span class="tag">${sec.sectorTag}</span>
              <h2>${sec.sectorName} <span class="hud-badge" style="margin-left:0.5rem;">${sec.mythBadge}</span></h2>
            </div>
            <button class="back-btn" onclick="showOverview()">◀ 全体概要に戻る</button>
          </div>

          <div class="mecha-list-section">
            ${mechaItemsHTML}
          </div>

          <div class="story-card">
            <div class="tag">// ARCHIVE REPORT: ${sec.story.tag}</div>
            <div class="title">${sec.story.title}</div>
            <div class="text">"${sec.story.text}"</div>
          </div>
        </div>
      `;
    }

    function toggleAccordion(id) {
      const item = document.getElementById(id);
      if (item) {
        item.classList.toggle('open');
      }
    }

    function updateActiveNav(activeId) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      if (activeId === 'overview') {
        document.querySelector('.overview-btn').classList.add('active');
      } else {
        const targetBtn = document.getElementById(`nav-${activeId}`);
        if (targetBtn) targetBtn.classList.add('active');
      }
    }

    // Three.js 3D地球儀実装
    const container = document.getElementById('globe-canvas');
    const width = container.clientWidth;
    const height = container.clientHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.z = 200;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');

    const earthMap = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_atmos_2048.jpg');
    const earthBump = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_normal_2048.jpg');
    const earthSpec = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_specular_2048.jpg');

    const earthMat = new THREE.MeshPhongMaterial({
      map: earthMap,
      bumpMap: earthBump,
      bumpScale: 0.05,
      specularMap: earthSpec,
      specular: new THREE.Color(0x223344),
      shininess: 15
    });
    const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(68, 64, 64), earthMat);
    globeGroup.add(earthMesh);

    const cloudsMap = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_clouds_1024.png');
    const cloudsMat = new THREE.MeshLambertMaterial({
      map: cloudsMap,
      transparent: true,
      opacity: 0.35,
      blending: THREE.AdditiveBlending
    });
    const cloudsMesh = new THREE.Mesh(new THREE.SphereGeometry(68.8, 64, 64), cloudsMat);
    globeGroup.add(cloudsMesh);

    const atmosphereMat = new THREE.MeshBasicMaterial({
      color: 0x00d4ff,
      side: THREE.BackSide,
      transparent: true,
      opacity: 0.18
    });
    const atmosphereMesh = new THREE.Mesh(new THREE.SphereGeometry(72.5, 64, 64), atmosphereMat);
    scene.add(atmosphereMesh);

    const ambientLight = new THREE.AmbientLight(0x404855, 1.2);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.position.set(180, 80, 150);
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0x00f0ff, 0.6);
    rimLight.position.set(-180, -50, -100);
    scene.add(rimLight);

    function latLonToVector3(lat, lon, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const x = -(radius * Math.sin(phi) * Math.cos(theta));
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    const pinObjects = [];
    const pinGeo = new THREE.SphereGeometry(1.8, 16, 16);
    const ringGeo = new THREE.RingGeometry(2.6, 3.6, 24);

    SECTORS_DATA.forEach(sec => {
      const pos = latLonToVector3(sec.lat, sec.lon, 69.5);

      const pinMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
      const pin = new THREE.Mesh(pinGeo, pinMat);
      pin.position.copy(pos);
      pin.userData = { targetId: sec.id };
      globeGroup.add(pin);
      pinObjects.push(pin);

      const ringMat = new THREE.MeshBasicMaterial({ color: 0xe5b95f, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.copy(pos.clone().multiplyScalar(1.005));
      ring.lookAt(pos.clone().multiplyScalar(2));
      globeGroup.add(ring);
    });

    globeGroup.rotation.y = -Math.PI / 2;

    let isDragging = false;
    let prevPos = { x: 0, y: 0 };
    let autoRotate = true;
    let targetRotation = null;

    container.addEventListener('pointerdown', e => {
      isDragging = true;
      autoRotate = false;
      targetRotation = null;
      prevPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    container.addEventListener('pointermove', e => {
      if (isDragging) {
        const deltaX = e.clientX - prevPos.x;
        const deltaY = e.clientY - prevPos.y;
        globeGroup.rotation.y += deltaX * 0.005;
        globeGroup.rotation.x += deltaY * 0.005;
        prevPos = { x: e.clientX, y: e.clientY };
      }
    });

    // 目的の緯度経度に地球儀をスムーズに回転
    function rotateGlobeTo(lat, lon) {
      autoRotate = false;
      const targetY = - (lon + 90) * (Math.PI / 180);
      const targetX = (lat) * (Math.PI / 180) * 0.3;
      targetRotation = { x: targetX, y: targetY };
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    container.addEventListener('click', e => {
      const rect = container.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(pinObjects);

      if (intersects.length > 0) {
        const targetId = intersects[0].object.userData.targetId;
        selectSector(targetId);
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      if (targetRotation) {
        globeGroup.rotation.y += (targetRotation.y - globeGroup.rotation.y) * 0.06;
        globeGroup.rotation.x += (targetRotation.x - globeGroup.rotation.x) * 0.06;
      } else if (!isDragging && autoRotate) {
        globeGroup.rotation.y += 0.0012;
        cloudsMesh.rotation.y += 0.0018;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // モーダル
    function openModal(src, title) {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      const caption = document.getElementById('modal-caption');
      modalImg.src = src;
      caption.textContent = `DEEP ARCHIVE ANALYSIS // ${title}`;
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('image-modal').classList.remove('active');
    }

    // 起動時実行
    showOverview();
  </script>
</body>
</html>
